name: PSLScanner

options:
  bundleIdPrefix: com.psllens
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  PSLScanner:
    type: application
    platform: iOS
    sources:
      - path: PSLScanner
    settings:
      base:
        PRODUCT_NAME: PSLScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.psllens.scanner
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PSL Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: Камера TrueDepth используется для локального трёхмерного сканирования поверхности лица.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
